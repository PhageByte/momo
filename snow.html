<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球球的超级铲雪车</title>
    <!-- 引入 Tailwind CSS 进行快速样式设计 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入可爱的中文圆体字 (ZCOOL KuaiLe) -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'ZCOOL KuaiLe', cursive; /* 使用可爱的字体 */
            background: linear-gradient(to bottom, #E0F2FE, #FFFFFF); /* 雪天渐变背景 */
            overflow-x: hidden;
        }

        /* 雪花动画样式 */
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 1.5rem;
            opacity: 0.8;
            pointer-events: none; /* 让雪花不影响点击 */
            animation: fall linear forwards;
            z-index: 50;
            text-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        @keyframes fall {
            to {
                transform: translateY(105vh);
            }
        }

        /* 卡片浮动效果 */
        .story-card {
            transition: transform 0.3s ease;
        }
        .story-card:hover {
            transform: scale(1.02);
        }

        /* 播放器按钮动画 */
        .pulse-btn {
            animation: pulse-yellow 2s infinite;
        }
        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(250, 204, 21, 0); }
            100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
        }
    </style>
</head>
<body class="min-h-screen relative">

    <!-- 雪花容器 -->
    <div id="snow-container"></div>

    <!-- 顶部标题区 -->
    <header class="text-center pt-8 pb-4 px-4 relative z-10">
        <h1 class="text-4xl md:text-6xl text-blue-600 drop-shadow-lg">
            ❄️ 球球的超级铲雪车 ❄️
        </h1>
        <!-- <p class="text-gray-500 mt-2 text-xl">为 3 岁的球球专属定制</p> -->
    </header>

    <!-- 主要内容区 -->
    <main class="container mx-auto px-4 pb-32 max-w-3xl relative z-10">
        
        <!-- 照片展示区 -->
        <div class="bg-white p-3 rounded-3xl shadow-2xl rotate-1 hover:rotate-0 transition duration-500 mb-8 border-4 border-yellow-400">
            <div class="relative aspect-video rounded-2xl overflow-hidden bg-gray-100">
                <!-- 这里的 src 指向本地图片，如果找不到会显示占位符 -->
                <img src="snow.png" 
                     onerror="this.onerror=null; this.src='https://placehold.co/800x600/FFD700/FFFFFF?text=这里放球球的照片\n(文件名: snow.png)';" 
                     alt="球球开铲雪车" 
                     class="w-full h-full object-cover">
            </div>
        </div>

        <!-- 故事内容卡片 -->
        <div class="space-y-6">
            
            <div class="story-card bg-white/90 backdrop-blur-sm p-6 rounded-2xl shadow-lg border-l-8 border-blue-400">
                <p class="text-3xl text-gray-700 leading-relaxed text-center">
                    下大雪啦！❄️
                    <br>
                    球球坐进了他的<span class="text-yellow-500 font-bold">黄色除雪大铲车</span>。
                </p>
            </div>

            <div class="story-card bg-white/90 backdrop-blur-sm p-6 rounded-2xl shadow-lg border-r-8 border-yellow-400">
                <p class="text-3xl text-gray-700 leading-relaxed text-center">
                    球球握好方向盘，大声喊：
                    <br><br>
                    <span class="text-4xl block text-blue-600">“我是除雪小队长，出发咯！Let's Go!!!” 🚀</span>
                </p>
            </div>

            <div class="story-card bg-white/90 backdrop-blur-sm p-6 rounded-2xl shadow-lg border-l-8 border-blue-400">
                <p class="text-3xl text-gray-700 leading-relaxed">
                    <span class="font-bold text-gray-800 block text-center mb-2">轰隆隆—— 轰隆隆——！！！</span>
                    除雪大铲车的大铲子<span class="text-blue-500 font-bold">推呀推</span>，把雪推开啦！
                    <br>
                    马路变得干干净净！✨
                    <br>
                    球球笑得好开心。😆
                </p>
            </div>

            <div class="story-card bg-white/90 backdrop-blur-sm p-6 rounded-2xl shadow-lg border-b-8 border-green-400 mb-8">
                <p class="text-3xl text-gray-700 leading-relaxed text-center">
                    球球真是一个勤劳能干的<br>
                    <span class="text-red-500 font-bold">超级除雪小队长</span>。❤️
                </p>
            </div>

        </div>
    </main>

    <!-- 底部固定音频播放器 -->
    <div class="fixed bottom-0 left-0 w-full bg-white border-t-4 border-yellow-400 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] p-4 z-50">
        <div class="container mx-auto max-w-3xl flex items-center justify-between gap-4">
            
            <!-- 播放按钮 (类似玩具的大按钮) -->
            <button id="playBtn" onclick="toggleAudio()" class="pulse-btn bg-yellow-400 hover:bg-yellow-500 text-white rounded-full w-16 h-16 flex items-center justify-center shadow-lg transform active:scale-95 transition">
                <svg id="icon-play" class="w-8 h-8 fill-current ml-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" class="w-8 h-8 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <!-- 进度条和文字 -->
            <div class="flex-1">
                <div class="text-gray-600 text-lg mb-1 flex justify-between">
                    <span>🎧 给球球讲故事</span>
                    <span id="timeDisplay">00:00 / 00:00</span>
                </div>
                <!-- 进度条 -->
                <div class="w-full bg-gray-200 rounded-full h-4 cursor-pointer relative" onclick="seekAudio(event)">
                    <div id="progressBar" class="bg-blue-400 h-4 rounded-full w-0 transition-all duration-100 relative">
                        <!-- 进度条末端的小雪球 -->
                        <div class="absolute right-0 top-1/2 transform translate-x-1/2 -translate-y-1/2 w-6 h-6 bg-white border-2 border-blue-400 rounded-full shadow-sm"></div>
                    </div>
                </div>
            </div>

            <!-- 音频元素 (隐藏) -->
            <audio id="storyAudio" preload="metadata">
                <!-- 这里指向本地音频文件 -->
                <source src="snow.mp3" type="audio/mpeg">
                您的浏览器不支持播放音频。
            </audio>
        </div>
    </div>

    <script>
        // --- 雪花特效脚本 ---
        function createSnowflake() {
            const snowContainer = document.getElementById('snow-container');
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = ['❄️', '❅', '❆'][Math.floor(Math.random() * 3)];
            
            // 随机位置和大小
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem';
            
            // 随机动画时长 (3s 到 8s)
            const duration = Math.random() * 5 + 3;
            snowflake.style.animationDuration = duration + 's';
            
            snowContainer.appendChild(snowflake);

            // 动画结束后移除元素
            setTimeout(() => {
                snowflake.remove();
            }, duration * 1000);
        }

        // 每 300ms 生成一个雪花
        setInterval(createSnowflake, 300);


        // --- 音频播放器控制脚本 ---
        const audio = document.getElementById('storyAudio');
        const playBtn = document.getElementById('playBtn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');

        function toggleAudio() {
            if (audio.paused) {
                audio.play().catch(e => alert("请确保文件夹里有 story.mp3 文件哦！"));
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                playBtn.classList.remove('pulse-btn'); // 播放时停止呼吸动画
            } else {
                audio.pause();
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                playBtn.classList.add('pulse-btn');
            }
        }

        // 更新进度条
        audio.addEventListener('timeupdate', () => {
            if(audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
                timeDisplay.innerText = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
            }
        });

        // 播放结束重置
        audio.addEventListener('ended', () => {
            iconPlay.classList.remove('hidden');
            iconPause.classList.add('hidden');
            progressBar.style.width = '0%';
            playBtn.classList.add('pulse-btn');
        });

        // 点击进度条跳转
        function seekAudio(e) {
            const width = e.target.closest('div').clientWidth; // 获取总宽度
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        }

        // 格式化时间 mm:ss
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
