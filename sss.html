        @media (min-width: 768px) {
            body.overflow-hidden {
                overflow: auto;
            }
        }
        
        /* 简洁的动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* 按钮效果 */
        .btn-press {
            transition: all 0.15s ease;
        }
        
        .btn-press:active {
            transform: scale(0.98);
        }

                    { title_en: "348: Row row row your boat", title_cn: "划呀, 划呀, 划小船", videoUrl: "https://cn.eudic.net/ting/openArticle?id=ee14c8c1-d567-4767-83ae-fbe0be60a35b" },
                    { title_en: "152: This is the way we go to bed", title_cn: "我们上床睡觉吧", videoUrl: "https://cn.eudic.net/ting/openArticle?id=76d8fb2f-ae8c-4e90-b2ac-b3710b7a772f" },
                    { title_en: "002: Twinkle twinkle little star", title_cn: "一闪一闪亮晶晶", videoUrl: "https://cn.eudic.net/ting/openArticle?id=c1ee39f1-8ddd-44ca-8268-df20febc0a0f" },
                    { title_en: "208: Twinkle twinkle little star", title_cn: "一闪一闪亮晶晶", videoUrl: "https://cn.eudic.net/ting/openArticle?id=076c597b-04e9-4d80-b8e4-7a6be1a981be" },
                    { title_en: "258: Twinkle twinkle little star", title_cn: "一闪一闪亮晶晶", videoUrl: "https://cn.eudic.net/ting/openArticle?id=224b584c-abbc-43dd-aab7-0439eaf3c9c5" },
                    { title_en: "354: Good night song", title_cn: "晚安歌", videoUrl: "https://cn.eudic.net/ting/openArticle?id=87a869a5-aa13-4506-a89c-d95f229dfc0f" },
                    { title_en: "014: Sweet dreams", title_cn: "好梦", videoUrl: "https://cn.eudic.net/ting/openArticle?id=de57e9ed-38b3-48f6-832a-96307253bf25" }
                ]
            };

            const colorPalette = [
                { 
                    bg: 'bg-orange-50', 
                    hoverBg: 'hover:bg-orange-100', 
                    text: 'text-orange-600', 
                    hoverText: 'group-hover:text-orange-700',
                    border: 'border-orange-200',
                    icon: '☀️'
                },
                { 
                    bg: 'bg-blue-50', 
                    hoverBg: 'hover:bg-blue-100', 
                    text: 'text-blue-600', 
                    hoverText: 'group-hover:text-blue-700',
                    border: 'border-blue-200',
                    icon: '🚗'
                },
                { 
                    bg: 'bg-green-50', 
                    hoverBg: 'hover:bg-green-100', 
                    text: 'text-green-600', 
                    hoverText: 'group-hover:text-green-700',
                    border: 'border-green-200',
                    icon: '🤸'
                },
                { 
                    bg: 'bg-purple-50', 
                    hoverBg: 'hover:bg-purple-100', 
                    text: 'text-purple-600', 
                    hoverText: 'group-hover:text-purple-700',
                    border: 'border-purple-200',
                    icon: '📚'
                },
                { 
                    bg: 'bg-indigo-50', 
                    hoverBg: 'hover:bg-indigo-100', 
                    text: 'text-indigo-600', 
                    hoverText: 'group-hover:text-indigo-700',
                    border: 'border-indigo-200',
                    icon: '🌙'
                },
                { 
                    bg: 'bg-gray-50', 
                    hoverBg: 'hover:bg-gray-100', 
                    text: 'text-gray-600', 
                    hoverText: 'group-hover:text-gray-700',
                    border: 'border-gray-200',
                    icon: '😴'
                },
            ];
            
            // --- Elements ---
            const body = document.body;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const menuToggle = document.getElementById('menu-toggle');
            const categoryNav = document.getElementById('category-nav');
            const songListContainer = document.getElementById('song-list-container');
            const welcomeMessage = document.getElementById('welcome-message');
            const mobileHeaderTitle = document.getElementById('mobile-header-title');

            // --- Functions ---
            const toggleSidebar = () => {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
                body.classList.toggle('overflow-hidden');
            };

            function renderNav() {
                categoryNav.innerHTML = Object.keys(songsData).map((category, index) => {
                    const color = colorPalette[index % colorPalette.length];
                    return `
                        <a href="#" data-category="${category}" class="nav-link group flex items-center px-4 py-3 text-gray-700 font-medium rounded-lg ${color.bg} ${color.hoverBg} ${color.text} ${color.hoverText} transition-all duration-200 border ${color.border} hover:shadow-sm btn-press">
                            <span class="text-lg mr-3">${color.icon}</span>
                            <span class="text-sm">${category}</span>
                        </a>
                    `;
                }).join('');
            }
            
            function renderSongs(category) {
                const songs = songsData[category];
                if (!songs) return;

                welcomeMessage.classList.add('hidden');
                mobileHeaderTitle.textContent = category;
                
                // 获取分类对应的颜色主题
                const categoryIndex = Object.keys(songsData).indexOf(category);
                const categoryColor = colorPalette[categoryIndex % colorPalette.length];
                
                songListContainer.innerHTML = `
                    <div class="mb-6">
                        <div class="flex items-center mb-4">
                            <div class="w-8 h-8 ${categoryColor.bg} rounded-lg flex items-center justify-center mr-3">
                                <span class="text-lg">${categoryColor.icon}</span>
                            </div>
                            <h2 class="text-2xl font-semibold ${categoryColor.text} hidden md:block">${category}</h2>
                        </div>
                    </div>
                    <div class="space-y-3">
                        ${songs.map((song, index) => {
                            const hasLink = song.videoUrl && song.videoUrl.trim() !== '';
                            const color = colorPalette[index % colorPalette.length];
                            
                            const hoverEffect = hasLink ? `hover:shadow-md hover:-translate-y-1` : '';
                            const titleColor = hasLink ? `${color.hoverText}` : '';

                            const contentHTML = `
                                <div class="p-4 flex items-center space-x-4">
                                    <div class="flex-shrink-0 w-10 h-10 rounded-lg ${color.bg} flex items-center justify-center ${color.text}">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                            <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3V4a1 1 0 00-.804-.98z" />
                                        </svg>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h3 class="font-semibold text-gray-800 truncate ${titleColor} transition-colors">${song.title_en}</h3>
                                        <p class="text-sm text-gray-600 truncate ${titleColor} transition-colors">${song.title_cn || '&nbsp;'}</p>
                                    </div>
                                    ${hasLink ? `
                                    <div class="text-gray-400 ${color.hoverText} transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                        </svg>
                                    </div>` : `
                                    <div class="text-gray-300">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>`}
                                </div>
                            `;

                            if (hasLink) {
                                return `
                                <a href="${song.videoUrl}" target="_blank" rel="noopener noreferrer" class="group block rounded-lg shadow-sm overflow-hidden transition-all duration-200 ${color.bg} ${hoverEffect} btn-press">
                                    ${contentHTML}
                                </a>`;
                            } else {
                                return `
                                <div class="block rounded-lg shadow-sm overflow-hidden transition-all duration-200 ${color.bg} opacity-60">
                                    ${contentHTML}
                                </div>`;
                            }
                        }).join('')}
                    </div>
                `;
            }

            // --- Event Listeners ---
            menuToggle.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
            
            categoryNav.addEventListener('click', e => {
                e.preventDefault();
                const link = e.target.closest('.nav-link');
                if (link) {
                    const category = link.dataset.category;
                    
                    // 移除所有激活状态
                    document.querySelectorAll('.nav-link').forEach(nav => {
                        nav.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-300');
                    });
                    
                    // 添加激活状态
                    link.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-300');
                    
                    renderSongs(category);
                    
                    // Close sidebar on mobile after selection
                    if (window.innerWidth < 768) {
                        toggleSidebar();
                    }
                }
            });
            
            // --- Initialization ---
            renderNav();
        });
    </script>
</body>
</html>
